# ============================================================
# platformio_override.ini — Console WLED custom
# Base: wled/WLED main (17.0.0-dev), tested on commit 20e7a71, arduino-esp32 3.3.8
# Target: ESP32-S3-WROOM-1 N16R8 (16MB flash Quad / 8MB PSRAM Octal)
# Installation, patches and settings: CONSOLE_README.md
# ============================================================

[env:console_s3]
extends = env:esp32s3dev_16MB_opi

build_flags =
    ${env:esp32s3dev_16MB_opi.build_flags}
    -D WLED_RELEASE_NAME=\"Console_S3\"

    ; 8 macro switches + BLACKOUT (GPIO3) = 9 native buttons
    -D WLED_MAX_BUTTONS=10

    ; Native USB in OTG mode (TinyUSB) for the MIDI+COM device. WLED's log therefore
    ; goes out on the UART (the devkit's "UART" port), not on the native USB.
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

    ; Rotary encoder (KY-040): CLK=GPIO6, DT=GPIO7, SW=GPIO15
    ; (default values, can be changed later in Config > Usermods)
    -D ENCODER_CLK_PIN=6
    -D ENCODER_DT_PIN=7
    -D ENCODER_SW_PIN=15

    ; DMX: WLED output (non-blocking SparkFunDMX) on UART2 / TX = GPIO17.
    ; The input (esp_dmx, RX = GPIO18, UART1) is already enabled on the S3 and is configured by console_dmx.
    ; Requires the core patches (CONSOLE_README.md section 3, details in patch_dmx.txt).
    -D WLED_ENABLE_DMX
    -D DMX_TX_PIN=17

    ; Audio: PCM1808 line-in on I2S. WLED is master (generates BCK and LRCK) and supplies MCLK (256 x fs).
    ; Type 4 = "Generic I2S with Master Clock": scale suited to a line-in, microphone filter disabled.
    ; These are only the initial values: if the device already has a saved configuration
    ; (Config > Usermods > AudioReactive) that one wins, so check it.
    -D SR_DMTYPE=4
    -D I2S_CKPIN=14
    -D I2S_SDPIN=21
    -D I2S_WSPIN=47
    -D MCLK_PIN=48

; Usermods included in the build (since WLED 16 they are enabled this way, no longer with -D USERMOD_*)
; - audioreactive, four_line_display_ALT, rotary_encoder_ui_ALT: already in the repo (usermods/ folder)
; - console_*: our own usermods, in usermods/console_faders/, console_io/, console_usb/, console_dmx/
custom_usermods =
    audioreactive
    four_line_display_ALT
    rotary_encoder_ui_ALT
    console_faders
    console_io
    console_usb
    console_dmx


; ============================================================
; W5500 (SPI Ethernet) — SEPARATE environment: flash this one only when the module is connected.
; Needs the Ethernet patch (eth_patch/patch_core_eth.diff + wled00/eth_w5500.cpp, see patch_eth.txt).
; For the normal build (WiFi only) keep using console_s3.
;
; W5500 module -> ESP32-S3 wiring:
;   SCLK->GPIO12  MOSI->GPIO11  MISO->GPIO13  SCS->GPIO10
;   RST ->GPIO43  3.3V->3.3V    GND->GND            (INT: leave unconnected, the chip is polled)
; GPIO43 is the UART0 TX pin and GPIO44 its RX: the patch releases UART0 (no serial log, no serial Adalight/Improv).
; ============================================================
[env:console_s3_eth]
extends = env:console_s3

; console_eth: shows the W5500 state on WLED's Info page (no serial log in this build)
custom_usermods =
    ${env:console_s3.custom_usermods}
    console_eth

build_flags =
    ${env:console_s3.build_flags}
    -D WLED_USE_ETHERNET
    -D WLED_USE_ETHERNET_SPI
    ; Ethernet type "W5500 (SPI)" selected by default
    -D WLED_ETH_DEFAULT=1
    -D WLED_W5500_SCLK=12
    -D WLED_W5500_MOSI=11
    -D WLED_W5500_MISO=13
    -D WLED_W5500_CS=10
    ; INT is NOT used (-1 = the driver polls every 10 ms) and its wire must stay disconnected:
    ; GPIO44 is the UART0 RX of the devkit's USB-serial bridge, an INT wire on it breaks flashing
    ; ("no sync reply, the serial TX path seems to be down").
    -D WLED_W5500_INT=-1
    -D WLED_W5500_RST=43
    ; conservative SPI clock for the first test with jumper wires; can be raised (up to 33) later
    -D WLED_W5500_SPI_MHZ=10
